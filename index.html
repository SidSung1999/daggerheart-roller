<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daggerheart 角色卡 & 擲骰器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h1>⚔ DAGGERHEART</h1>
  <div class="char-bar">
    <select id="charSelect" aria-label="選擇角色"></select>
    <button type="button" id="btnNew">新增</button>
    <button type="button" id="btnDel">刪除</button>
    <button type="button" id="btnExport">匯出</button>
    <button type="button" id="btnImport">匯入</button>
    <button type="button" id="btnGs" title="從 Google 試算表的「匯出頁」匯入成新角色">Google 匯入</button>
    <button type="button" id="btnRoom" title="加入共享房間，和同桌的人即時看到彼此的擲骰">🌐 房間</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
  <nav class="main-tabs">
    <button type="button" data-view="sheet" class="active">角色卡</button>
    <button type="button" data-view="roller">擲骰器</button>
    <button type="button" data-view="free">自由擲骰</button>
  </nav>
</div>

<main>
  <section id="view-sheet" class="view active"><div id="sheet"></div></section>
  <section id="view-roller" class="view"><div id="roller"></div></section>
  <section id="view-free" class="view"><div id="freeroll"></div></section>
</main>

<div id="levelup" class="lu-overlay" hidden></div>
<div id="gsimport" class="lu-overlay" hidden></div>
<div id="roomdlg" class="lu-overlay" hidden></div>
<aside id="roomdock" class="rd" hidden aria-label="共享擲骰紀錄"></aside>
<div id="toast" role="status"></div>
<datalist id="weaponList"></datalist>
<datalist id="mainWeaponList"></datalist>
<datalist id="offWeaponList"></datalist>
<datalist id="domainList"></datalist>
<datalist id="armorList"></datalist>


<script src="js/dice.js"></script>
<script src="js/data.js"></script>
<script src="js/weapons.js"></script>
<script src="js/armors.js"></script>
<script src="js/origins.js"></script>
<script src="js/classes.js"></script>
<script src="js/class-rules.js"></script>
<script src="js/origin-rules.js"></script>
<script src="js/stat-bonus.js"></script>
<script src="js/levelup.js"></script>
<script src="js/domain-cards.js"></script>
<script src="js/domain-card-fx.js"></script>
<script src="js/trait-fx.js"></script>
<script src="js/store.js"></script>
<script src="js/weapon-lib.js"></script>
<script src="js/armor-lib.js"></script>
<script src="js/levelup-ui.js"></script>
<script src="js/config.js"></script>
<script src="js/sheet-import.js"></script>
<script src="js/sheet.js"></script>
<script src="js/roller.js"></script>
<script src="js/freeroll.js"></script>
<script src="js/room-firebase.js"></script>
<script src="js/room.js"></script>
<script src="js/main.js"></script>
</body>
</html>
